name: "Cocotb test"
description: "Run a Python cocotb testbench against a Verilog DUT and report pass/fail"
author: "Md Zesun Ahmed Mia"

inputs:
  verilog-sources:
    description: "Space-separated DUT Verilog files, relative to the workspace"
    required: true
  toplevel:
    description: "Top-level DUT module name"
    required: true
  python-module:
    description: "Python test module name (without .py)"
    required: true
  simulator:
    description: "Cocotb SIM backend (icarus; verilator needs >= 5.036 in the image)"
    required: false
    default: "icarus"
  timeout-minutes:
    description: "Simulation timeout in minutes"
    required: false
    default: "10"
  working-directory:
    description: "Subdirectory to run in (DUT sources and the Python module resolve here)"
    required: false
    default: "."
  image:
    description: "Container image with cocotb"
    required: false
    default: "ghcr.io/zesun33/verilog:latest"

outputs:
  tests:
    description: "TESTS=PASS/FAIL/SKIP summary line from cocotb, if emitted"
    value: ${{ steps.cocotb.outputs.tests }}

runs:
  using: composite
  steps:
    - name: Resolve cocotb makefiles dir (fail fast with diagnostics)
      shell: bash
      run: |
        set -o pipefail
        MAKEFILES=$(docker run --rm "${{ inputs.image }}" cocotb-config --makefiles 2>&1 | tee /dev/stderr | tail -n 1)
        if [ -z "$MAKEFILES" ]; then
          echo "::error::cocotb-config --makefiles empty in ${{ inputs.image }}"
          exit 1
        fi
        docker run --rm "${{ inputs.image }}" test -d "$MAKEFILES" || { echo "::error::makefiles dir missing: $MAKEFILES"; exit 1; }
        echo "MAKEFILES=$MAKEFILES" >> "$GITHUB_ENV"

    - name: Run cocotb regression
      id: cocotb
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Paths: only github.workspace is mounted (at /workspace), so every
      # container-side path is workspace-relative; host-side writes use the
      # absolute workspace path. DUT sources resolve under working-directory.
      run: |
        set -o pipefail
        MK="${{ github.workspace }}/.hw_ci_cocotb.mk"
        SRC=""
        for f in ${{ inputs.verilog-sources }}; do
          case "$f" in
            /*) SRC="$SRC $f" ;;
            *) SRC="$SRC ${{ inputs.working-directory }}/$f" ;;
          esac
        done
        PYPP=""
        if [ "${{ inputs.working-directory }}" != "." ]; then
          PYPP="-e PYTHONPATH=/workspace/${{ inputs.working-directory }}"
        fi
        cat > "$MK" <<'EOF'
        SIM ?= ${{ inputs.simulator }}
        TOPLEVEL_LANG ?= verilog
        TOPLEVEL = ${{ inputs.toplevel }}
        MODULE = ${{ inputs.python-module }}
        EOF
        echo "VERILOG_SOURCES ?= $SRC" >> "$MK"
        echo "include $MAKEFILES/Makefile.sim" >> "$MK"
        LOG=$(docker run --rm \
          -v "${{ github.workspace }}:/workspace:Z" \
          -w /workspace \
          -e SIM="${{ inputs.simulator }}" \
          -e TOPLEVEL_LANG=verilog \
          -e MODULE="${{ inputs.python-module }}" \
          -e TOPLEVEL="${{ inputs.toplevel }}" \
          $PYPP \
          "${{ inputs.image }}" \
          bash -c "timeout ${{ inputs.timeout-minutes }}m make -f .hw_ci_cocotb.mk; rm -f .hw_ci_cocotb.mk" 2>&1 | tee /dev/stderr)
        SUMMARY=$(echo "$LOG" | grep -m1 -oE "TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+ SKIP=[0-9]+" || true)
        echo "tests=${SUMMARY:-unknown}" >> "$GITHUB_OUTPUT"
        echo "$LOG" | grep -q "results.xml" || true
        test -f "${{ github.workspace }}/sim_build/results.xml" -o -f "${{ github.workspace }}/results.xml" || { echo "::error::cocotb produced no results.xml"; exit 1; }
